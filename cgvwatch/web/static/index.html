<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGV 예매 오픈 알리미</title>
<style>
  :root {
    --bg-base: #17130F;
    --bg-surface: #211B16;
    --bg-elevated: #2C241D;
    --line: #3A2F27;
    --text: #F4EEE4;
    --text-muted: #A99C8D;
    --accent: #E23744;
    --accent-hover: #F04654;
    --gold: #F5B841;

    --status-waiting-bg: #2E3A44;
    --status-waiting-fg: #9FB3C4;
    --status-open-bg: #4A3A16;
    --status-open-fg: #F5B841;
    --status-error-bg: #4A2420;
    --status-error-fg: #F0857C;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-base);
    color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--line);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  header h1 {
    font-size: 1.25rem;
    margin: 0;
    font-weight: 600;
    color: var(--text);
  }

  .interval-box {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .interval-value {
    color: var(--text);
    font-weight: 600;
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid transparent;
  }

  .interval-value:hover {
    border-color: var(--line);
    background: var(--bg-elevated);
  }

  .interval-input {
    width: 70px;
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 0.95rem;
  }

  #error-banner {
    display: none;
    background: var(--status-error-bg);
    color: var(--status-error-fg);
    border-bottom: 1px solid var(--line);
    padding: 10px 24px;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  #error-banner.visible {
    display: flex;
  }

  #error-banner button {
    background: transparent;
    border: none;
    color: var(--status-error-fg);
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
  }

  main {
    flex: 1;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    max-width: 960px;
    width: 100%;
    margin: 0 auto;
  }

  section {
    background: var(--bg-surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 20px;
  }

  section h2 {
    margin: 0 0 12px 0;
    font-size: 1rem;
    color: var(--text-muted);
    font-weight: 600;
  }

  .empty-watch {
    color: var(--text-muted);
    text-align: center;
    padding: 24px 8px;
    font-size: 0.92rem;
  }

  .watch-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .watch-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
  }

  .watch-subtitle {
    color: var(--text-muted);
    font-size: 0.92rem;
  }

  .watch-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    color: var(--text-muted);
    font-size: 0.82rem;
  }

  .watch-badges {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .badge-mode {
    background: var(--bg-elevated);
    color: var(--gold);
    border: 1px solid var(--line);
  }

  .watch-checked {
    color: var(--text-muted);
    font-size: 0.8rem;
  }

  .watch-hunt-line {
    color: var(--text-muted);
    font-size: 0.86rem;
  }

  .watch-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .extra-watch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid var(--line);
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.82rem;
    font-weight: 600;
  }

  .badge-waiting {
    background: var(--status-waiting-bg);
    color: var(--status-waiting-fg);
  }

  .badge-open {
    background: var(--status-open-bg);
    color: var(--status-open-fg);
    box-shadow: 0 0 8px rgba(245, 184, 65, 0.55);
  }

  .badge-error {
    background: var(--status-error-bg);
    color: var(--status-error-fg);
  }

  .screen-filter {
    margin-top: 4px;
    font-size: 0.74rem;
    color: var(--gold);
    opacity: 0.85;
  }

  .check-row {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text);
    font-size: 0.9rem;
    padding: 8px 0;
  }

  .hunt-mark {
    margin-top: 4px;
    font-size: 0.74rem;
    color: var(--accent-hover);
  }

  .error-reason {
    margin-top: 4px;
    font-size: 0.74rem;
    color: var(--status-error-fg);
    opacity: 0.85;
    max-width: 260px;
    word-break: break-all;
  }

  .delete-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-muted);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 0.85rem;
  }

  .delete-btn:hover {
    border-color: var(--accent);
    color: var(--accent-hover);
  }

  .mode-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }

  .mode-btn {
    background: var(--bg-elevated);
    color: var(--text-muted);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }

  .mode-btn[aria-pressed="true"] {
    background: var(--accent);
    color: var(--text);
    border-color: var(--accent);
  }

  .mode-help {
    color: var(--text-muted);
    font-size: 0.82rem;
    margin: 0 0 14px 0;
  }

  form#add-watch-form {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 160px;
  }

  .field label {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  select, input[type="date"], input[type="number"], input[type="text"] {
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 0.9rem;
    font-family: inherit;
  }

  select:focus, input:focus {
    outline: none;
    border-color: var(--accent);
  }

  button.primary {
    background: var(--accent);
    color: var(--text);
    border: none;
    border-radius: 4px;
    padding: 9px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }

  button.primary:hover {
    background: var(--accent-hover);
  }

  button.primary:disabled {
    background: var(--bg-elevated);
    color: var(--text-muted);
    cursor: not-allowed;
  }
</style>
</head>
<body>
  <header>
    <h1>CGV 예매 오픈 알리미</h1>
    <div class="interval-box">
      <span>감시 주기(초):</span>
      <span id="interval-display" class="interval-value" title="클릭해서 수정">-</span>
      <input id="interval-input" class="interval-input" type="number" min="5" style="display:none">
    </div>
    <div class="interval-box">
      <button id="browser-btn" class="primary" type="button">브라우저 열기</button>
      <span id="hunt-status">헌팅 대기</span>
    </div>
  </header>

  <div id="error-banner">
    <span id="error-message"></span>
    <button id="error-close" aria-label="닫기">&times;</button>
  </div>

  <main>
    <section>
      <h2>감시 중</h2>
      <div id="watch-area">
        <div class="empty-watch">감시 중인 영화가 없습니다. 아래에서 등록하세요.</div>
      </div>
    </section>

    <section>
      <h2>감시 등록</h2>
      <div class="mode-toggle" role="group" aria-label="헌팅 모드">
        <button type="button" class="mode-btn" id="mode-now-btn" aria-pressed="false">이미 열린 회차 노리기</button>
        <button type="button" class="mode-btn" id="mode-onopen-btn" aria-pressed="true">열리면 잡기</button>
      </div>
      <p class="mode-help" id="mode-help"></p>
      <form id="add-watch-form">
        <div class="field">
          <label for="movie-select">영화</label>
          <select id="movie-select" required></select>
        </div>
        <div class="field">
          <label for="theater-select">극장</label>
          <select id="theater-select" required></select>
        </div>
        <div class="field">
          <label for="date-input">날짜</label>
          <input id="date-input" type="date" required>
        </div>
        <div class="field">
          <label for="screen-input">관 필터 (선택)</label>
          <input id="screen-input" type="text" list="screen-options"
                 placeholder="예: IMAX" maxlength="30"
                 title="관 이름에 이 키워드가 포함된 회차가 열릴 때만 알림">
          <datalist id="screen-options">
            <option value="IMAX"></option>
            <option value="SCREENX"></option>
            <option value="4DX"></option>
            <option value="DOLBY"></option>
            <option value="리클라이너"></option>
            <option value="GOLD CLASS"></option>
          </datalist>
        </div>
        <div class="field">
          <label for="seat-count-input">인원</label>
          <select id="seat-count-input">
            <option value="1">1명</option>
            <option value="2">2명</option>
          </select>
        </div>
        <div class="field">
          <label for="row-offset-input">중앙 기준 열 오프셋</label>
          <input id="row-offset-input" type="number" min="-5" max="5" value="1">
        </div>
        <div class="field">
          <label for="pref-time-input">선호 시각 (선택)</label>
          <input id="pref-time-input" type="time">
        </div>
        <div class="field">
          <button type="submit" class="primary" id="add-btn">추가</button>
        </div>
      </form>
    </section>
  </main>

<script>
(function () {
  "use strict";

  var STATUS_BADGE = {
    "대기중": "badge-waiting",
    "열림": "badge-open",
    "오류": "badge-error"
  };

  var errorBanner = document.getElementById("error-banner");
  var errorMessage = document.getElementById("error-message");
  var errorClose = document.getElementById("error-close");
  var watchArea = document.getElementById("watch-area");
  var movieSelect = document.getElementById("movie-select");
  var theaterSelect = document.getElementById("theater-select");
  var dateInput = document.getElementById("date-input");
  var screenInput = document.getElementById("screen-input");
  var seatCountInput = document.getElementById("seat-count-input");
  var rowOffsetInput = document.getElementById("row-offset-input");
  var prefTimeInput = document.getElementById("pref-time-input");
  var addForm = document.getElementById("add-watch-form");
  var addBtn = document.getElementById("add-btn");
  var intervalDisplay = document.getElementById("interval-display");
  var intervalInput = document.getElementById("interval-input");
  var browserBtn = document.getElementById("browser-btn");
  var huntStatus = document.getElementById("hunt-status");
  var modeNowBtn = document.getElementById("mode-now-btn");
  var modeOnopenBtn = document.getElementById("mode-onopen-btn");
  var modeHelp = document.getElementById("mode-help");

  var MODE_LABEL = { "now": "지금 노리는 중", "onopen": "열리면 잡기" };
  var MODE_HELP = {
    "now": "이미 예매가 열린 회차입니다. 등록하면 바로 좌석을 노립니다.",
    "onopen": "아직 안 열린 날짜입니다. 열리는 순간 자동으로 좌석을 노립니다."
  };

  var currentMode = "onopen";
  var lastWatches = [];
  var lastHunt = null;

  function setMode(mode) {
    currentMode = mode;
    modeNowBtn.setAttribute("aria-pressed", mode === "now" ? "true" : "false");
    modeOnopenBtn.setAttribute("aria-pressed", mode === "onopen" ? "true" : "false");
    modeHelp.textContent = MODE_HELP[mode];
  }

  modeNowBtn.addEventListener("click", function () { setMode("now"); });
  modeOnopenBtn.addEventListener("click", function () { setMode("onopen"); });
  setMode("onopen");

  function showError(msg) {
    errorMessage.textContent = msg;
    errorBanner.classList.add("visible");
  }

  function hideError() {
    errorBanner.classList.remove("visible");
  }

  errorClose.addEventListener("click", hideError);

  function loadHunt() {
    fetch("/api/hunt")
      .then(function (res) {
        if (!res.ok) throw new Error("헌팅 상태를 불러오지 못했습니다.");
        return res.json();
      })
      .then(function (h) {
        lastHunt = h;
        var parts = [h.browser ? "브라우저 켜짐" : "브라우저 꺼짐"];
        if (h.active) parts.push("헌팅 중");
        if (h.queued > 0) parts.push("대기 " + h.queued);
        if (h.last && h.last.status) {
          parts.push("최근: " + h.last.status +
            (h.last.seats && h.last.seats.length ? " " + h.last.seats.join(",") : ""));
        }
        huntStatus.textContent = parts.join(" · ");
        renderWatches(lastWatches);
      })
      .catch(function (err) { showError(err.message); });
  }

  browserBtn.addEventListener("click", function () {
    browserBtn.disabled = true;
    fetch("/api/hunt/browser", { method: "POST" })
      .then(function (res) {
        if (!res.ok) throw new Error("브라우저를 열지 못했습니다.");
        huntStatus.textContent = "브라우저 여는 중…";
      })
      .catch(function (err) { showError(err.message); })
      .finally(function () { browserBtn.disabled = false; });
  });

  function todayYmd() {
    var d = new Date();
    var mm = String(d.getMonth() + 1).padStart(2, "0");
    var dd = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + mm + "-" + dd;
  }

  dateInput.min = todayYmd();
  dateInput.value = todayYmd();

  function formatDate(ymd) {
    if (!ymd || ymd.length !== 8) return ymd || "";
    return ymd.slice(0, 4) + "-" + ymd.slice(4, 6) + "-" + ymd.slice(6, 8);
  }

  function huntBtnFor(w) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "delete-btn";
    btn.textContent = "지금 헌팅";
    btn.addEventListener("click", function () {
      btn.disabled = true;
      fetch("/api/hunt/" + w.id, { method: "POST" })
        .then(function (res) {
          if (!res.ok) throw new Error("헌팅을 시작하지 못했습니다.");
          loadHunt();
        })
        .catch(function (err) { showError(err.message); })
        .finally(function () { btn.disabled = false; });
    });
    return btn;
  }

  function stopBtnFor(active) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "delete-btn";
    btn.textContent = "중단";
    btn.disabled = !active;
    btn.addEventListener("click", function () {
      btn.disabled = true;
      fetch("/api/hunt/stop", { method: "POST" })
        .then(function (res) {
          if (!res.ok) throw new Error("헌팅을 중단하지 못했습니다.");
          loadHunt();
        })
        .catch(function (err) { showError(err.message); });
    });
    return btn;
  }

  function delBtnFor(w) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "delete-btn";
    btn.textContent = "삭제";
    btn.addEventListener("click", function () {
      deleteWatch(w.id);
    });
    return btn;
  }

  function buildWatchCard(w) {
    var card = document.createElement("div");
    card.className = "watch-card";

    var title = document.createElement("div");
    title.className = "watch-title";
    title.textContent = w.mov_nm;
    card.appendChild(title);

    var subtitleParts = [w.site_nm, formatDate(w.target_ymd)];
    if (w.screen_filter) subtitleParts.push(w.screen_filter + " 관만");
    var subtitle = document.createElement("div");
    subtitle.className = "watch-subtitle";
    subtitle.textContent = subtitleParts.join(" · ");
    card.appendChild(subtitle);

    var metaParts = [];
    if (w.seat_count) metaParts.push("인원 " + w.seat_count + "명");
    if (w.preferred_time) {
      metaParts.push("선호 시각 " + w.preferred_time.slice(0, 2) + ":" + w.preferred_time.slice(2, 4));
    }
    if (w.row_offset) metaParts.push("열 오프셋 " + w.row_offset);
    if (metaParts.length) {
      var meta = document.createElement("div");
      meta.className = "watch-meta";
      metaParts.forEach(function (t) {
        var span = document.createElement("span");
        span.textContent = t;
        meta.appendChild(span);
      });
      card.appendChild(meta);
    }

    var badges = document.createElement("div");
    badges.className = "watch-badges";

    var modeBadge = document.createElement("span");
    modeBadge.className = "badge badge-mode";
    modeBadge.textContent = MODE_LABEL[w.mode] || MODE_LABEL.onopen;
    badges.appendChild(modeBadge);

    var statusBadge = document.createElement("span");
    statusBadge.className = "badge " + (STATUS_BADGE[w.status] || "badge-waiting");
    statusBadge.textContent = w.status;
    if (w.last_error) statusBadge.title = w.last_error;
    badges.appendChild(statusBadge);

    var checked = document.createElement("span");
    checked.className = "watch-checked";
    checked.textContent = "마지막 확인 " + (w.last_checked || "-");
    badges.appendChild(checked);

    card.appendChild(badges);

    if (w.last_error) {
      var reason = document.createElement("div");
      reason.className = "error-reason";
      reason.textContent = w.last_error;
      card.appendChild(reason);
    }

    var huntLine = document.createElement("div");
    huntLine.className = "watch-hunt-line";
    var isActive = !!(lastHunt && lastHunt.active === w.id);
    if (isActive) {
      huntLine.textContent = "헌팅 중";
    } else if (lastHunt && lastHunt.last && lastHunt.last.watch_id === w.id && lastHunt.last.status) {
      var seatsText = lastHunt.last.seats && lastHunt.last.seats.length
        ? " " + lastHunt.last.seats.join(", ") : "";
      huntLine.textContent = "마지막 헌팅 결과: " + lastHunt.last.status + seatsText;
    } else {
      huntLine.textContent = "헌팅 기록 없음";
    }
    card.appendChild(huntLine);

    var actions = document.createElement("div");
    actions.className = "watch-actions";
    actions.appendChild(huntBtnFor(w));
    actions.appendChild(stopBtnFor(isActive));
    actions.appendChild(delBtnFor(w));
    card.appendChild(actions);

    return card;
  }

  function renderWatches(watches) {
    watchArea.innerHTML = "";
    if (!watches || watches.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty-watch";
      empty.textContent = "감시 중인 영화가 없습니다. 아래에서 등록하세요.";
      watchArea.appendChild(empty);
      return;
    }

    watchArea.appendChild(buildWatchCard(watches[0]));

    watches.slice(1).forEach(function (w) {
      var row = document.createElement("div");
      row.className = "extra-watch-row";
      var label = document.createElement("span");
      label.textContent = w.mov_nm + " · " + w.site_nm;
      row.appendChild(label);
      row.appendChild(delBtnFor(w));
      watchArea.appendChild(row);
    });
  }

  function loadWatches() {
    fetch("/api/watches")
      .then(function (res) {
        if (!res.ok) throw new Error("감시 목록을 불러오지 못했습니다.");
        return res.json();
      })
      .then(function (data) {
        lastWatches = data || [];
        renderWatches(lastWatches);
      })
      .catch(function (err) {
        showError(err.message || "감시 목록을 불러오지 못했습니다.");
      });
  }

  function deleteWatch(id) {
    return fetch("/api/watches/" + id, { method: "DELETE" })
      .then(function (res) {
        if (!res.ok && res.status !== 204) {
          throw new Error("삭제에 실패했습니다.");
        }
        loadWatches();
      })
      .catch(function (err) {
        showError(err.message || "삭제에 실패했습니다.");
      });
  }

  function loadMovies() {
    fetch("/api/movies")
      .then(function (res) {
        if (!res.ok) throw new Error("영화 목록을 불러오지 못했습니다 (CGV API 오류).");
        return res.json();
      })
      .then(function (movies) {
        movieSelect.innerHTML = "";
        movies.forEach(function (m) {
          var opt = document.createElement("option");
          opt.value = m.mov_no;
          opt.textContent = m.mov_nm;
          opt.dataset.movNm = m.mov_nm;
          movieSelect.appendChild(opt);
        });
      })
      .catch(function (err) {
        showError(err.message || "영화 목록을 불러오지 못했습니다.");
      });
  }

  function loadTheaters() {
    fetch("/api/theaters")
      .then(function (res) {
        if (!res.ok) throw new Error("극장 목록을 불러오지 못했습니다 (CGV API 오류).");
        return res.json();
      })
      .then(function (regions) {
        theaterSelect.innerHTML = "";
        regions.forEach(function (region) {
          var group = document.createElement("optgroup");
          group.label = region.name;
          (region.sites || []).forEach(function (site) {
            var opt = document.createElement("option");
            opt.value = site.site_no;
            opt.textContent = site.site_nm;
            opt.dataset.siteNm = site.site_nm;
            group.appendChild(opt);
          });
          theaterSelect.appendChild(group);
        });
      })
      .catch(function (err) {
        showError(err.message || "극장 목록을 불러오지 못했습니다.");
      });
  }

  function loadSettings() {
    fetch("/api/settings")
      .then(function (res) {
        if (!res.ok) throw new Error("설정을 불러오지 못했습니다.");
        return res.json();
      })
      .then(function (settings) {
        intervalDisplay.textContent = settings.interval_sec;
      })
      .catch(function (err) {
        showError(err.message || "설정을 불러오지 못했습니다.");
      });
  }

  var savingInterval = false;

  function saveInterval() {
    if (savingInterval) return;
    savingInterval = true;
    var value = parseInt(intervalInput.value, 10);
    if (!value || value < 5) {
      intervalInput.style.display = "none";
      intervalDisplay.style.display = "inline";
      savingInterval = false;
      return;
    }
    fetch("/api/settings", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ interval_sec: value })
    })
      .then(function (res) {
        if (!res.ok) throw new Error("설정 변경에 실패했습니다.");
        return res.json();
      })
      .then(function (settings) {
        intervalDisplay.textContent = settings.interval_sec;
      })
      .catch(function (err) {
        showError(err.message || "설정 변경에 실패했습니다.");
      })
      .finally(function () {
        intervalInput.style.display = "none";
        intervalDisplay.style.display = "inline";
        savingInterval = false;
      });
  }

  intervalDisplay.addEventListener("click", function () {
    intervalInput.value = intervalDisplay.textContent;
    intervalDisplay.style.display = "none";
    intervalInput.style.display = "inline-block";
    intervalInput.focus();
    intervalInput.select();
  });

  intervalInput.addEventListener("blur", saveInterval);
  intervalInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      saveInterval();
    } else if (e.key === "Escape") {
      intervalInput.style.display = "none";
      intervalDisplay.style.display = "inline";
    }
  });

  addForm.addEventListener("submit", function (e) {
    e.preventDefault();

    var movOpt = movieSelect.options[movieSelect.selectedIndex];
    var siteOpt = theaterSelect.options[theaterSelect.selectedIndex];

    if (!movOpt || !siteOpt || !dateInput.value) {
      showError("영화, 극장, 날짜를 모두 선택해 주세요.");
      return;
    }

    var ymd = dateInput.value.replace(/-/g, "");

    if (lastWatches && lastWatches.length > 0) {
      if (!window.confirm("이미 감시 중인 영화가 있습니다. 교체할까요?")) {
        return;
      }
    }

    var payload = {
      mov_no: movOpt.value,
      mov_nm: movOpt.dataset.movNm || movOpt.textContent,
      site_no: siteOpt.value,
      site_nm: siteOpt.dataset.siteNm || siteOpt.textContent,
      target_ymd: ymd,
      screen_filter: screenInput.value.trim(),
      mode: currentMode,
      hunt_enabled: true,
      seat_count: parseInt(seatCountInput.value, 10),
      row_offset: parseInt(rowOffsetInput.value, 10) || 0,
      preferred_time: prefTimeInput.value.replace(":", "")
    };

    addBtn.disabled = true;

    Promise.all((lastWatches || []).map(function (w) { return deleteWatch(w.id); }))
      .then(function () {
        return fetch("/api/watches", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      })
      .then(function (res) {
        if (!res.ok) throw new Error("감시 추가에 실패했습니다.");
        return res.json();
      })
      .then(function () {
        loadWatches();
        loadHunt();
      })
      .catch(function (err) {
        showError(err.message || "감시 추가에 실패했습니다.");
      })
      .finally(function () {
        addBtn.disabled = false;
      });
  });

  loadWatches();
  loadMovies();
  loadTheaters();
  loadSettings();
  loadHunt();

  setInterval(loadWatches, 5000);
  setInterval(loadHunt, 5000);
})();
</script>
</body>
</html>
